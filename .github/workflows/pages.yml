# Publish wiki/ as the repo's GitHub Pages site.
#
# One-time enable after the first push:
#   gh api repos/{owner}/{repo}/pages -X POST -f build_type=workflow
#
# Jekyll renders the markdown with its default theme — no build system,
# no Gemfile, nothing to maintain in-repo.
name: pages

on:
  push:
    branches: [main, master]
    paths: [wiki/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./wiki
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
